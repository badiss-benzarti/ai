spring.application.name=travelmate

# 8080 is used by Oracle on this machine
server.port=8081

# MySQL (XAMPP: root / no password)
spring.datasource.url=jdbc:mysql://localhost:3306/travelmate?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ollama (shared by all modules)
ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:7b
ollama.timeout-seconds=180

# Angular dev server
app.cors.allowed-origins=http://localhost:4200
